# Production stack on the sandbox server, deployed by Dokploy as a Compose app with Isolated Deployment.
# The bot uses long polling, so nothing is published or routed; the database is reachable only from the bot.
# Secrets come from the Dokploy Environment tab (see .env.example); POSTGRES_PASSWORD is used by both services.
services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mathias:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/mathias
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathias
      POSTGRES_DB: mathias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathias -d mathias"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 200

volumes:
  pgdata:
